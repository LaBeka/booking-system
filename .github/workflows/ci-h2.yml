name: CI with H3 database

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["Sprint1"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
#      checkout in our code
      - name: checkout code
        uses: actions/checkout@v6

#        install in right java version

      - name: setup java
        uses: actions/setup/java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

#          build and run tests
      - name: build and run tests
        run: mvn -B clean verify

